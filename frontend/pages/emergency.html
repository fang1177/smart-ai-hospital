<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency SOS — Smart Hospital</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=2.0.1" />
  <style>
    .emergency-container { max-width: 900px; margin: 0 auto; }
    .sos-btn-large {
      width: 150px; height: 150px; border-radius: 50%;
      background: #ff4d4d; color: white; border: none;
      font-size: 2rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7);
      animation: pulse-red 2s infinite;
      margin: 30px auto; display: flex; align-items: center; justify-content: center;
      transition: 0.3s;
    }
    .sos-btn-large:hover { transform: scale(1.05); background: #ff3333; }
    @keyframes pulse-red {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(255, 77, 77, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
    }
    .status-card { border-left: 5px solid #ff4d4d; }
    .status-accepted { border-left-color: #3498db; }
    .status-resolved { border-left-color: #2ecc71; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="layout dashboard-layout">
    <div class="main-wrapper">
      <header class="topbar" id="topbar-placeholder"></header>
      <main class="page-content">
        <div class="emergency-container">
          
          <!-- Patient View -->
          <div id="patientEmergencyView" class="hidden">
            <div class="welcome-banner" style="background: linear-gradient(135deg, #ff4d4d 0%, #c0392b 100%);">
              <div class="welcome-text">
                <h2>EMERGENCY SOS 🚨</h2>
                <p>Press the button below to trigger an immediate medical emergency request.</p>
              </div>
            </div>

            <div class="card glass-card animate-fly-in" style="text-align: center; padding: 40px;">
              <button class="sos-btn-large" id="sosBtn">SOS</button>
              <p style="margin-top: 10px; font-weight: 600; color: #ff4d4d;">CLICK FOR IMMEDIATE HELP</p>
              
              <div id="sosForm" style="display: none; text-align: left; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px;">
                <div class="form-group">
                  <label class="form-label">Type of Emergency</label>
                  <select id="emergencyType" class="form-control">
                    <option value="Accident">Accident / Injury</option>
                    <option value="Cardiac">Cardiac / Chest Pain</option>
                    <option value="Respiratory">Breathing Difficulty</option>
                    <option value="Neurological">Unconsciousness / Seizure</option>
                    <option value="Other">Other Medical Crisis</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Describe current issue</label>
                  <textarea id="issueDescription" class="form-control" rows="2" placeholder="Briefly describe what happened..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">Your Location (Text)</label>
                  <input type="text" id="locationText" class="form-control" placeholder="e.g. Ward 4, Room 202 or Home Address" />
                </div>
                <div class="form-group">
                  <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" id="requestAmbulance" style="width:20px; height:20px;"> Request Ambulance
                  </label>
                </div>
                <button class="btn btn-danger w-full" id="confirmSos" style="justify-content:center; padding:15px; font-size:1.1rem;">CONFIRM SOS REQUEST</button>
              </div>
            </div>

            <div class="card glass-card" style="margin-top:30px;">
              <div class="card-header"><div class="card-title">My Recent SOS Requests</div></div>
              <div id="myEmergencies" class="notif-list"></div>
            </div>
          </div>

          <!-- Admin / Doctor View -->
          <div id="staffEmergencyView" class="hidden">
            <div class="welcome-banner">
              <div class="welcome-text">
                <h2>Active Emergencies</h2>
                <p>Monitor and respond to critical patient requests.</p>
              </div>
            </div>

            <div class="dashboard-grid" style="grid-template-columns: 1fr;">
              <div class="card glass-card">
                <div class="card-header">
                  <div class="card-title">🚨 Urgent Requests</div>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Time</th><th>Patient</th><th>Type</th><th>Location</th><th>Status</th><th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="staffEmergenciesList">
                      <tr><td colspan="6"><div class="spinner"></div></td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js?v=2.0.1"></script>
  <script src="../assets/js/ui.js?v=2.0.1"></script>
  <script src="../assets/js/emergency.js?v=2.0.1"></script>
</body>
</html>
